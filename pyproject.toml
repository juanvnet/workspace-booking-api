[project]
name = "workspace-booking-api"
version = "1.0.0"
description = "REST API to book meeting rooms without double bookings."
requires-python = ">=3.12"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# conftest.py sets the environment variables before importing the app on purpose.
"tests/conftest.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]